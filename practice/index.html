<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ブロック崩し</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <h1>ブロック崩し</h1>
      <div class="status">
        <span>スコア: <strong id="score">0</strong></span>
        <span>ライフ: <strong id="lives">3</strong></span>
        <span>ステージ: <strong id="stage">1</strong></span>
      </div>
    </header>

    <canvas id="canvas" width="480" height="640"></canvas>

    <p class="help">← → キー / マウス / タッチでパドルを操作、スペースキーかクリックで発射・一時停止</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
